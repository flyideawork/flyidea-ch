name: Publish landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static website only
        run: |
          mkdir _site
          cp index.html styles.css content.css themes.css theme.js contact.js robots.txt sitemap.xml CNAME 404.html _site/
          cp -R assets _site/assets
          cp -R pdf-in-kurs-umwandeln ki-kurs-erstellen lernmaterialien-aufbereiten ki-gestuetztes-lernen ki-lernplattform _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
